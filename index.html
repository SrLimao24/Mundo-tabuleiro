<style>
/* Layout: cabeçalho do jogo, cinco abas (Banco, Terras, Baús, Poder, Mundo) com barra fixa embaixo; mar escuro e ouro. */
:root{
  color-scheme: dark;
  --bg:#0b1a22; --surface:#122733; --surface-2:#1a3444; --line:#26485b;
  --fg:#e9f0f3; --muted:#90a8b5; --gold:#e6b63f; --on-gold:#241a00;
  --bad:#ec6a57; --good:#58bb8c;
  --font-display:'Pirata One',Georgia,serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --bg:#e9f1f5; --surface:#ffffff; --surface-2:#dbe8ee; --line:#b8ccd7;
    --fg:#0e2430; --muted:#516b79; --gold:#a8730a; --on-gold:#ffffff;
    --bad:#c13d2b; --good:#1f7a52;
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#e9f1f5; --surface:#ffffff; --surface-2:#dbe8ee; --line:#b8ccd7;
  --fg:#0e2430; --muted:#516b79; --gold:#a8730a; --on-gold:#ffffff;
  --bad:#c13d2b; --good:#1f7a52;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:15px; line-height:1.45;
  padding-block:12px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(44px,env(safe-area-inset-right,0px));
}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-weight:400;font-size:30px;letter-spacing:.5px;margin:0;color:var(--gold);line-height:1.1}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 8px;font-weight:600}
.chip{font-size:12px;padding:5px 10px;border-radius:99px;background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.chip b{color:var(--gold)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;min-width:0}
.row>*{min-width:0}
.money{font-variant-numeric:tabular-nums;font-weight:700}
.big{font-family:var(--font-display);font-size:54px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.title{font-family:var(--font-display);font-size:30px;line-height:1.1;color:var(--gold)}
.muted{color:var(--muted)}
.small{font-size:13px}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good);border-radius:99px}
.bar.low>i{background:var(--bad)}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=number],input[type=url],input[type=password],select{
  width:100%;background:var(--surface-2);color:var(--fg);border:1px solid var(--line);
  border-radius:10px;padding:12px;font:inherit;font-size:16px;
}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn{
  background:var(--gold);color:var(--on-gold);border:0;border-radius:10px;padding:12px 16px;
  font:inherit;font-weight:700;font-size:15px;cursor:pointer;min-height:46px;
}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:600}
.btn.danger{background:var(--bad);color:#fff}
.btn.small{min-height:38px;padding:8px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.msg{padding:10px 12px;border-radius:10px;font-size:14px;border:1px solid var(--line);background:var(--surface-2)}
.msg.ok{border-color:var(--good)} .msg.err{border-color:var(--bad)}
.banner{background:var(--bad);color:#fff;border-radius:14px;padding:14px}
.banner b{font-family:var(--font-display);font-weight:400;font-size:24px;display:block}
.list{display:flex;flex-direction:column}
.item{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);min-width:0}
.item:last-child{border-bottom:0}
.item>span:first-child{min-width:0;overflow-wrap:anywhere}
.pos{color:var(--good)} .neg{color:var(--bad)}
.classes{display:grid;gap:8px}
.cls{display:block;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;margin:0;color:var(--fg)}
.cls input{margin-right:8px;accent-color:var(--gold)}
.cls small{display:block;color:var(--muted);margin-left:26px}
.event{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;justify-content:space-between;align-items:center}
.event b{display:block}
.rents{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.rents div{background:var(--surface-2);border-radius:8px;padding:6px 2px;font-size:12px;color:var(--muted)}
.rents div.on{outline:2px solid var(--gold);color:var(--fg)}
.rents b{display:block;font-size:14px;color:var(--fg);font-variant-numeric:tabular-nums}
/*qr*/.qr{background:#fff;padding:10px;border-radius:12px;display:inline-block;line-height:0}.qr img,.qr canvas{max-width:100%;height:auto}
code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--surface-2);padding:2px 6px;border-radius:6px;overflow-wrap:anywhere}
nav{
  position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:5;
  display:flex;flex-direction:column;gap:3px;
}
nav button{
  writing-mode:vertical-rl;background:var(--surface);color:var(--muted);border:1px solid var(--line);border-right:0;
  font:inherit;font-weight:700;font-size:11px;letter-spacing:.06em;line-height:1;
  padding:12px 4px;min-width:24px;border-radius:10px 0 0 10px;cursor:pointer;
}
nav button[aria-current=true]{background:var(--gold);color:var(--on-gold);min-width:32px}
@media (prefers-reduced-motion: no-preference){.bar>i{transition:width .4s}}
#roulette{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:16px}
#roulette[hidden]{display:none}
.rbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center;max-width:320px;width:100%}
.rt{font-weight:700;margin-bottom:12px}.rr{font-family:var(--font-display);font-size:26px;color:var(--gold);min-height:34px;margin-top:12px}
.rwrap{position:relative;width:220px;height:220px;margin:0 auto}
.wheel{width:100%;height:100%;border-radius:50%;border:4px solid var(--fg)}
.ptr{position:absolute;left:50%;top:-12px;transform:translateX(-50%);border:10px solid transparent;border-top:20px solid var(--gold);z-index:2}
</style>

/* ---------- regras do jogo: saldo, vida e posses saem do histórico ---------- */
function applyEv(p,ev){
  if(p.dead||p.bankrupt) return;
  let dm=ev.money||0;
  if(ev.pct){ let pc=ev.pct; if(pc<0&&p.cls==='banqueiro') pc/=2; dm+=Math.round(Math.max(p.money,0)*pc/100); }

  if(dh>0&&p.cls==='medico') dh=Math.round(dh*1.5);
  p.money+=dm; p.hp=Math.min(MAXHP,p.hp+dh);
  p.hist.push({ts:ev.ts,text:ev.name,dm,dh});
  if(p.hp<=0) p.dead=true;

  const curPres=()=>{
    if(imp&&imp.status==='open'&&imp.stage===2) return null;
    if(president&&act(president)) return president;
    if(!president&&!noFallback&&S.game&&S.game.president&&act(S.game.president)) return S.game.president;

  };
  const activeFor=ts=>Object.values(P).filter(p=>act(p.id)&&p.joined<=ts);
  const ownsG=(owner,g)=>IDS.filter(x=>CAT[x].g===g&&CAT[x].kind==='country').every(x=>props[x].owner===owner&&!props[x].mort);
  const rentRep=id=>{ const c=cat(id),pr=props[id]; if(!c||c.kind!=='country') return 0; let r=c.rent[pr.level]; if(pr.level===0&&ownsG(pr.owner,c.g)) r*=2; return Math.round(r); };
  const addBill=(kind,payer,to,amount,reason,due,ts)=>{
    const id=kind+'-'+round+'-'+payer+'-'+(++billSeq);
    bills[id]={id,kind,payer,to,amount,reason,round,due,paid:false,ts};

      const y=Object.keys(imp.yes).length, n=Object.keys(imp.no).length, pn=P[imp.pres]?P[imp.pres].name:'O presidente';
      if(imp.stage===1){
        if(y*2>el){ imp.stage=2; imp.yes={}; imp.no={}; feed.push({ts:e.ts,text:'A acusação foi aceita: '+pn+' está suspenso e será julgado'}); }
        else if(n*2>=el){ imp.status='rejected'; lastImpEnd=e.ts; feed.push({ts:e.ts,text:'A acusação contra '+pn+' foi rejeitada'}); }
      }else{
        const need=Math.ceil(el*2/3);
        if(y>=need){ imp.status='removed'; lastImpEnd=e.ts; president=null; noFallback=true; feed.push({ts:e.ts,text:pn+' foi cassado. A presidência está vaga'}); }
        else if(n>el-need){ imp.status='acquitted'; lastImpEnd=e.ts; feed.push({ts:e.ts,text:pn+' foi absolvido e volta ao cargo'}); }
      }
    }else if(e.type==='elect'){
      if(!act(e.who)) continue; president=e.who; feed.push({ts:e.ts,text:P[e.who].name+' foi eleito presidente'});
    }else if(e.type==='stop'){
      const s=pl[e.place]; if(!s||!act(e.by)) continue;
      const amt=e.base*STOP_MULT[s.level]; me_.money-=amt;
      if(s.owner&&s.owner!==e.by&&act(s.owner)){ P[s.owner].money+=amt; H(P[s.owner],e.ts,'Visita de '+me_.name+' em '+PLACES[e.place].name,amt); }
      H(me_,e.ts,'Parou em '+PLACES[e.place].name,-amt);
      feed.push({ts:e.ts,text:me_.name+' pagou '+fmt(amt)+' em '+PLACES[e.place].name});
    }else if(e.type==='payeach'){
      if(!act(e.by)) continue; const others=Object.values(P).filter(q=>q.id!==e.by&&act(q.id)&&q.joined<=e.ts);
      me_.money-=e.amount*others.length; others.forEach(q=>{q.money+=e.amount;H(q,e.ts,'Recebeu de '+me_.name,e.amount);});
      H(me_,e.ts,'Pagou a cada jogador',-e.amount*others.length);
      feed.push({ts:e.ts,text:me_.name+' pagou '+fmt(e.amount)+' a cada jogador'});
    }else if(e.type==='collecteach'){
      if(!act(e.by)) continue; const others=Object.values(P).filter(q=>q.id!==e.by&&act(q.id)&&q.joined<=e.ts);
      me_.money+=e.amount*others.length; others.forEach(q=>{q.money-=e.amount;H(q,e.ts,'Pagou a '+me_.name,-e.amount);});
      H(me_,e.ts,'Recebeu de cada jogador',e.amount*others.length);
      feed.push({ts:e.ts,text:me_.name+' recebeu '+fmt(e.amount)+' de cada jogador'});
    }
  }
  const Pv={}; for(const [k,p] of Object.entries(P)) if(!p.quit) Pv[k]=p;
  const all=Object.values(Pv);
  const dead=all.filter(p=>p.dead);
  const standing=all.filter(p=>!p.dead&&!p.bankrupt).sort((a,b)=>b.money-a.money);
  const last=all.length>=2&&standing.length<=1;
  C={P:Pv,props,pl,bills,round,rolled:[...rolled],taxRate,loanRate,president:curPres(),over:dead.length>0||last,dead,reason:dead.length?'death':'last',winner:standing[0]||null,feed:feed.reverse(),imp,reqs,lastImpEnd};
}
const me=()=>C.P[S.uid];

function ownsGroup(owner,g){
  const ids=IDS.filter(id=>CAT[id].g===g&&CAT[id].kind==='country'); if(!ids.length) return false;
  return ids.every(id=>C.props[id].owner===owner&&!C.props[id].mort);
}
function rentFor(id,payer,dice){
  const c=cat(id),pr=C.props[id]; if(!pr||!pr.owner) return 0; let r;
  if(c.kind==='company') r=dice*50;
  else { r=c.rent[pr.level]; if(pr.level===0&&ownsGroup(pr.owner,c.g)) r*=2; }
  const pl=C.P[payer]; if(pl&&pl.cls==='nomade') r*=0.75;
  return Math.round(r);
}
function buyCost(id){ const c=cat(id),m=me(); return Math.round(c.price*(m&&m.cls==='comerciante'?0.85:1)); }
function buildCost(id){ const c=cat(id),pr=C.props[id],m=me(); const base=pr.level>=2?c.hotel:c.casa; return Math.round(base*(m&&m.cls==='construtor'?0.75:1)); }
function sellValue(id){ const c=cat(id),pr=C.props[id]; return Math.round((pr.level>=3?c.hotel:c.casa)/2); }

function rouletteShow(chance,win,placeName,done){
  const r=$('#roulette'); if(!r) return done();
  const w=r.querySelector('.wheel'); const a=win?Math.random()*chance*3.6*0.9+chance*0.18:chance*3.6+Math.random()*(360-chance*3.6)*0.9+(360-chance*3.6)*0.05;
  w.style.transition='none'; w.style.transform='rotate(0deg)';
  w.style.background='conic-gradient(var(--good) 0 '+chance+'%, var(--bad) '+chance+'% 100%)';
  r.querySelector('.rt').textContent='Entrevista: '+placeName+' ('+chance+'% de chance)';
  r.querySelector('.rr').textContent='';
  r.hidden=false; void w.offsetWidth;
  w.style.transition='transform 3.4s cubic-bezier(.15,.7,.2,1)'; w.style.transform='rotate('+(360*4-a)+'deg)';
  setTimeout(()=>{ r.querySelector('.rr').textContent=win?'Contratado!':'Não passou desta vez.'; setTimeout(()=>{ r.hidden=true; done(); },1400); },3600);
}

function islandTick(){
  if(!ready()||!db||!S.uid||!S.canWrite) return;
  const r=rd(); if(!r) return; const g=openGuess(); if(!g||g.order[g.idx]!==S.uid) return;
  if(myCards().some(c=>c===g.p||c===g.t||c===g.l)) return;
  const key=g.id+':'+g.idx; if(S.tick===key) return; S.tick=key;
  const ni=g.idx+1;
  db.doc('iguess/'+g.id).update({idx:ni,idxAt:Date.now(),done:ni>=g.order.length}).catch(()=>{S.tick=null;});
}
async function scanFile(f){
  if(!f) return;
  let text=null;
  try{
    const bmp=await createImageBitmap(f);
    if('BarcodeDetector' in window){ try{ const d=new BarcodeDetector({formats:['qr_code']}); const r=await d.detect(bmp); if(r.length) text=r[0].rawValue; }catch(e){} }
    if(!text&&typeof jsQR!=='undefined'){
      const sc=Math.min(1,1100/Math.max(bmp.width,bmp.height)); const w=Math.round(bmp.width*sc), h=Math.round(bmp.height*sc);
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h; const x=cv.getContext('2d'); x.drawImage(bmp,0,0,w,h);
      const im=x.getImageData(0,0,w,h); const r=jsQR(im.data,w,h,{inversionAttempts:'attemptBoth'}); if(r) text=r.data;
    }
  }catch(e){}
  if(!text) return say('err','Não achei um QR nessa foto. Chegue mais perto, deixe o QR inteiro e bem iluminado, ou digite o código.');
  const code=String(text).split('#').pop();
  if(handleCode(code)){ render(); window.scrollTo(0,0); } else say('err','Li o QR, mas não reconheci esse código: '+code);
}

function pickLife(){
  if(S.fresh){ if(S.players[S.uid]) S.fresh=false; return; }
  let best=null;
  for(const [id,p] of Object.entries(S.players)){
    if(id!==S.base&&!id.startsWith(S.base+'~')) continue;
    if(!best||(p.joinedAt||0)>(S.players[best].joinedAt||0)) best=id;
  }
  S.uid=best||S.base;
}

async function guard(fn){

function clearHash(){ try{ if(location.hash) location.hash=''; }catch(e){} }
function handleCode(raw){
  const h=String(raw||'').trim().toUpperCase(); S.msg=null;
  if(h==='CASA-LOJA'||h==='HOTEL-LOJA'){ S.tab='dark'; buyHouse(h==='HOTEL-LOJA'?'hotel':'casa'); return true; }
  if(/^(BAU|EVT)-[A-Z0-9]+$/.test(h)){ S.pending=h; S.tab='more'; S.sub=h.startsWith('BAU-')?'chest':'power'; return true; }
  if(/^LOC-(CIDADE|MUNDO|ILHA)$/.test(h)){ S.locCode=h.slice(4).toLowerCase(); S.tab='me'; return true; }
  if(/^ISLA-[A-Z0-9]+$/.test(h)&&ILHA[h.slice(5)]){ S.ipSel=h.slice(5); S.tab='ilha'; return true; }
  if(/^LUG-[A-Z0-9]+$/.test(h)&&PLACES[h.slice(4)]){ S.place=h.slice(4); S.tab='city'; return true; }
  if(/^PAIS-[A-Z0-9]+$/.test(h)&&CAT[h.slice(5)]){ S.sel=h.slice(5); S.tab='land'; return true; }
  if(/^COB-[A-Z0-9]+$/.test(h)){ S.payCode=h; S.tab='bank'; return true; }
  if(/^JOG-[A-Z0-9]+$/.test(h)){ const id=Object.keys(S.players).find(k=>S.players[k].code===h); if(id&&id!==S.uid){ S.sendTarget=id; S.forceSend=true; S.tab='bank'; return true; } }
  return false;
}

async function sha(s){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)); return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join(''); }
async function openChest(raw){
  const code=String(raw||'').trim().toUpperCase();
  if(!/^BAU-[A-Z0-9]{4,12}$/.test(code)) return say('err','Código inválido. Ele começa com BAU-.');
  if(C.over) return say('err','O jogo já acabou.');
  const known=S.chests[code];
  if(known&&known.claimedBy){ const w=C.P[known.claimedBy]?C.P[known.claimedBy].name:'outro jogador'; S.pending=null; clearHash(); return say('err','Esse baú já foi aberto por '+w+'.'); }
  const ref=db.doc('chests/'+code);
  const lease=await ref.acquire({holder:S.uid,ttlMs:8000});
  if(!lease.acquired) return say('err','Alguém está abrindo esse baú agora. Tente de novo em instantes.');
  const snap=await ref.get(); const d=snap.exists?snap.data():null;
  if(!d||typeof d.value!=='number'){ try{await ref.delete();}catch(e){} return say('err','Esse baú não existe.'); }
  if(d.claimedBy){ const who=C.P[d.claimedBy]?C.P[d.claimedBy].name:'outro jogador'; S.pending=null; clearHash(); return say('err','Esse baú já foi aberto por '+who+'.'); }
  await ref.set({...d,claimedBy:S.uid,claimedAt:Date.now()});
  await db.collection('log').add({type:'chest',to:S.uid,amount:d.value,code,ts:Date.now()});
  const got=Math.round(d.value*(me()&&me().cls==='pirata'?1.2:1));
  S.pending=null; clearHash(); const i=$('#chestCode'); if(i) i.value='';
  say('ok','Tesouro! Você achou '+fmt(got)+'.');
}

  accuse:()=>guard(async()=>{

    const p=$('#acP').value,t=$('#acT').value,l=$('#acL').value;
    const ref=db.doc('island/round'); const lease=await ref.acquire({holder:S.uid,ttlMs:8000});
    if(!lease.acquired) return say('err','Outra pessoa está se declarando agora. Tente de novo.');
    const snap=await ref.get(); const d=snap.exists?snap.data():null;
    if(!d||d.status!=='on'||!d.players.includes(S.uid)) return say('err','Essa caça já acabou.');
    const sec=d.secret, win=sec.p===p&&sec.t===t&&sec.l===l;
    const others=d.players.filter(id=>id!==S.uid&&alive(id));
    if(win){
      const prize=TESOUROS[sec.t.slice(2)].val;
      await L({type:'bank',by:S.uid,amount:prize,note:'Tesouro encontrado: '+cardName(sec.t)});
      for(const id of others){
        await L({type:'bank',by:id,amount:-40,note:'Perdeu a caça ao tesouro'});
        await L({type:'hurt',by:id,hp:15,note:'Voltou machucado da ilha'});
        await L({type:'exile',by:id});
      }
      await ref.set({...d,status:'off',result:{winner:S.uid,secret:sec,prize,text:m.name+' descobriu o segredo e levou '+fmt(prize)+'. Os outros voltaram para a cidade.',ts:Date.now()}});
      return say('ok','Você acertou! Tesouro: '+fmt(prize)+'.');
    }
    await L({type:'bank',by:S.uid,amount:-80,note:'Acusação errada na ilha'});
    await L({type:'hurt',by:S.uid,hp:20,note:'Acusação errada'});
    await L({type:'exile',by:S.uid});
    const left=d.players.filter(id=>id!==S.uid);
    if(left.length<=1) await ref.set({...d,status:'off',players:left,result:{winner:null,secret:sec,text:m.name+' errou a acusação e a caça acabou sem vencedor.',ts:Date.now()}});

    say('err','Errou! Você perdeu $80, 20 de vida e voltou para a cidade.');

/* ---------- folha de QR para imprimir (imagem PNG) ---------- */
function wrap(ctx,text,x,y,w,lh){
  const words=String(text).split(' '); let line='';
  for(const word of words){ const t=line?line+' '+word:word; if(ctx.measureText(t).width>w&&line){ ctx.fillText(line,x,y); line=word; y+=lh; } else line=t; }
  if(line) ctx.fillText(line,x,y); return y;
}
async function sheet(items,filename){
  if(!downloads) return say('err','Download indisponível neste aparelho.');
  if(typeof QRCode==='undefined') return say('err','A biblioteca de QR não carregou. Verifique a conexão.');
  const W=1240,H=1754,cols=3,rows=4,mx=50,my=50,cw=(W-2*mx)/cols,ch=(H-2*my)/rows;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H; const x=cv.getContext('2d');
  x.fillStyle='#fff'; x.fillRect(0,0,W,H);
  items.forEach((it,i)=>{
    const c=i%cols,r=Math.floor(i/cols),ox=mx+c*cw,oy=my+r*ch;
    x.strokeStyle='#999'; x.setLineDash([8,8]); x.lineWidth=2; x.strokeRect(ox+4,oy+4,cw-8,ch-8); x.setLineDash([]);
    x.fillStyle='#111'; x.textAlign='center';
    x.font='bold 30px sans-serif'; x.fillText(it.title,ox+cw/2,oy+46,cw-30);
    x.font='24px sans-serif'; const yEnd=wrap(x,it.line,ox+cw/2,oy+80,cw-40,28);
    const box=document.createElement('div'); new QRCode(box,{text:qrText(it.code),width:280,height:280,correctLevel:QRCode.CorrectLevel.M});
    const qc=box.querySelector('canvas'); const qy=Math.max(oy+100,yEnd+20);
    if(qc) x.drawImage(qc,ox+(cw-280)/2,qy,280,280);
    x.font='bold 26px monospace'; x.fillText(it.code,ox+cw/2,qy+280+38,cw-20);
    if(it.sub){ x.font='20px sans-serif'; wrap(x,it.sub,ox+cw/2,qy+280+70,cw-40,24); }
  });
  const blob=await new Promise(res=>cv.toBlob(res,'image/png'));
  try{ await downloads.save({filename,data:blob}); say('ok','Folha pronta. Imprima a imagem salva.'); }
  catch(e){ if(e&&e.code==='declined') say('err','Download cancelado.'); else say('err','Não consegui salvar a imagem ('+(e&&e.code||'erro')+').'); }
}

async function acquireLease(fs,path,holder,ttlMs){
  const lr=fs.doc('locks/'+path.replace(/\//g,'_'));
  try{
    const ok=await fs.runTransaction(async tx=>{
      const s=await tx.get(lr); const d=s.exists?s.data():null; const now=Date.now();
      if(d&&d.holder!==holder&&d.exp>now) return false;
      tx.set(lr,{holder,exp:now+ttlMs}); return true;
    });
    return {acquired:!!ok};
  }catch(e){ return {acquired:false}; }
}

}
